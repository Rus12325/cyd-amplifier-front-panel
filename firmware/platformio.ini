; ESP32-2432S028 (CYD) - amplifier front panel
;
;   pio run  -e cyd     -t upload     control panel + analog-tap visualiser
;   pio run  -e cyd_enc -t upload     same, plus a real rotary encoder on 22/35
;   pio run  -e cyd_bt  -t upload     same, but the CYD is also the BT receiver
;
; Only two GPIOs of this board are free for outputs (22 and 27); GPIO 35 is an
; input-only pin with ADC, GPIO 21 is the backlight, and GPIO 26 feeds the
; on-board 3 W amplifier (it is the ESP32's DAC).  Everything the panel switches
; therefore hangs off those pins - see include/config.h and docs/wiring.md
; before wiring anything.
;
; CYD_BLE_HID: the panel is a Bluetooth LE HID keyboard for the PC, so the
; volume controls on its screen change the PC's volume (the PC is the audio
; source; there is no amplifier volume).  On in the cyd builds, off in the
; CYD_BT_SINK ones - A2DP and BLE cannot share the controller the way these
; libraries set it up.

[platformio]
default_envs = cyd

[cyd_base]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, direct
upload_speed = 921600
lib_deps = bodmer/TFT_eSPI@^2.5.43

; TFT_eSPI without touching User_Setup.h: everything comes from build flags.
; ILI9341_2 is the variant this board needs (the plain ILI9341_DRIVER shows
; inverted colours on a CYD).  TFT_BL is set per environment - the backlight is
; GPIO 21.  TOUCH_CS is deliberately not set: TFT_eSPI would talk to the touch
; controller over the display bus, which is not where this board wires it.  The
; panel is driven by src/touch.cpp instead.
build_flags =
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DCORE_DEBUG_LEVEL=0

[env:cyd]
extends = cyd_base
build_flags =
    ${cyd_base.build_flags}
    -DTFT_BL=21
    -DCYD_BT_SINK=0
    -DUSE_IO_EXPANDER=0
    -DCYD_BLE_HID=1

[env:cyd_enc]
extends = cyd_base
; cyd, plus a real rotary encoder.  The board has no free pin pair, so the
; encoder takes GPIO 22 (which was the spare key) and GPIO 35 (the ADC tap - the
; visualiser loses its analog input in this build).  Wire 10k pull-ups on both.
; The encoder's own switch can go to GPIO 0, but that is the BOOT strap: a knob
; held down during power-up lands the board in the ROM bootloader, so the build
; leaves it unused (-1).  See include/config.h for the flags.
build_flags =
    ${cyd_base.build_flags}
    -DTFT_BL=21
    -DCYD_BT_SINK=0
    -DUSE_IO_EXPANDER=0
    -DCYD_BLE_HID=1
    -DCFG_ENC_ENABLED=1

[env:cyd_bt]
extends = cyd_base
; The CYD as the A2DP sink.  The decoded audio leaves through the ESP32's own
; DAC on GPIO 26, which this board wires into its on-board amplifier and the P4
; speaker header - no extra module needs to be bought, nothing has to be cut,
; and the backlight keeps GPIO 21 (so the panel does not flicker).  Add
; -DCYD_BT_I2S_OUT=1 to send the audio to an external 16-bit I2S DAC on
; GPIO 21/22/27 instead; the backlight must then be hardwired on.
build_flags =
    ${cyd_base.build_flags}
    -DTFT_BL=21
    -DCYD_BT_SINK=1
    -DUSE_IO_EXPANDER=0
    -DCYD_BLE_HID=0
; The A2DP library is not in the PlatformIO registry, so pin the tag to keep a
; rebuild repeatable.
lib_deps =
    ${cyd_base.lib_deps}
    https://github.com/pschatzmann/ESP32-A2DP.git#v1.8.7

[env:cyd_bt_static]
extends = cyd_base
; Diagnostic image: identical to cyd_bt, but GPIO 21 is never attached to a
; PWM timer - the backlight level physically cannot change in firmware.  If
; the panel still pulses on this build, the cause is the board's power rails
; or the backlight circuit, and no amount of code will fix it.
build_flags =
    ${cyd_base.build_flags}
    -DTFT_BL=21
    -DCYD_BT_SINK=1
    -DUSE_IO_EXPANDER=0
    -DCYD_BLE_HID=0
    -DCYD_BL_STATIC=1
lib_deps =
    ${cyd_base.lib_deps}
    https://github.com/pschatzmann/ESP32-A2DP.git#v1.8.7
